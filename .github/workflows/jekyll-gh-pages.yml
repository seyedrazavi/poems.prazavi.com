name: Build & Deploy Jekyll (scheduled)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  SITE_DIR: docs
  TZ: Europe/London

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby 3.2 (compatible with github-pages/Jekyll 3.9)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.SITE_DIR }}

      - name: Install gems
        working-directory: ${{ env.SITE_DIR }}
        run: bundle install --jobs 4 --retry 3

      - name: Show versions (debug)
        working-directory: ${{ env.SITE_DIR }}
        run: |
          ruby -v
          bundle -v
          bundle exec jekyll -v

      - name: Build site
        working-directory: ${{ env.SITE_DIR }}
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
